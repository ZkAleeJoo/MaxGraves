#If you have any questions or problems, you can ask on the support server: https://discord.gg/Vr46JHm2kd
#Remember not to delete any line of code.
#For problems, bugs, ideas or suggestions you can do it on the discord server.
general:
  language: "en"
  #Check for updates on startup and periodically while the server is running?
  update-check: true
  #Send anonymous usage metrics to bStats?
  bstats: true
  prefix: "&#8A2BE2&lMaxGraves &8» "

grave:
  #Time in seconds before the tomb disappears (3600 = 1 hour)
  despawn-time: 3600
  #World names where graves should never be created
  blacklisted-worlds:
    - "pvp_nether"
    - "pvp_the_end"
    - "evento_pvp"
  #Maximum horizontal radius used to search for a safe grave location when the death spot is obstructed
  search-max-radius: 6
  #Enables detailed console traces for PlayerDeathEvent processing and final drops/exp state
  debug-death-events: false
  create-on-death: true
  marker:
    #Visual block used for new graves. Available: HEAD, CHEST
    #HEAD uses the dead player's skin, holograms, particles and claim animation.
    #CHEST places a chest block and opens a grave inventory where items can be taken one by one.
    #Warning: CHEST keeps holograms but ignores particles and claim animations.
    type: "HEAD"
  access:
    #If true, graves from player kills can be opened/looted by anyone.
    #This is false by default so existing private-grave behavior is preserved.
    public-player-kill: false
  info-menu:
    item:
      #Material used for each grave entry in /maxgraves info menu
      material: "PAPER"
  hologram:
    enabled: true
    #How many ticks between hologram refreshes (20 ticks = 1 second)
    update-interval-ticks: 20
    #Vertical offset from the grave marker to the first hologram line
    base-height: 0.3
    #Distance between each hologram line
    line-spacing: 0.25
    #Available placeholders: {player}, {player_level}, {killer}, {time_left}, {x}, {y}, {z}
    lines:
      - "&7{player} &c☠"
      - "&8• &fLvl: &7{player_level}"
      - "&8• &cKilled by &f{killer}"
      - "&e{time_left}"
  claim-animation:
    enabled: true
    #Delay before rewards are given after claiming (20 ticks = 1 second)
    delay-ticks: 20
    lightning:
      #Uses a visual lightning strike effect without damage
      enabled: true
    sound:
      #Sound played when claiming the grave
      type: "ITEM_TOTEM_USE"
      volume: 1.0
      pitch: 0.75
  effects:
    enabled: true
    #Particle update speed (5 ticks = 0.25 seconds)
    update-interval-ticks: 5
    #Primary particle drawn in the spiral around the grave (examples: SOUL, WITCH)
    primary-particle: "SOUL"
    #Secondary particle used as ambient smoke around the grave (examples: SMOKE, LARGE_SMOKE)
    secondary-particle: "SMOKE"
    primary-count: 4
    secondary-count: 2
    #Controls spiral shape and movement
    spiral-radius: 0.7
    spiral-height: 1.3
    vertical-speed: 0.05
    ambient-sound:
      enabled: true
      #Any Bukkit Sound enum value can be used
      type: "BLOCK_SOUL_SAND_HIT"
      volume: 0.45
      pitch: 0.7
